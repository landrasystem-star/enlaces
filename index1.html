<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Enlaces</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px;
        }
        .contenedor {
            background: #fff; padding: 40px 30px; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center; max-width: 400px; width: 100%;
        }
        h1 { color: #333; margin-bottom: 25px; font-size: 24px; }
        .boton {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 15px; margin-bottom: 15px;
            border-radius: 12px; text-decoration: none; color: #fff;
            font-size: 17px; font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .boton:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,0.25); }
        .boton svg { width: 24px; height: 24px; fill: #fff; }
        .whatsapp { background: #25D366; }
        .tiktok   { background: #000000; }
        .facebook { background: #1877F2; }
        .gmail    { background: #EA4335; }
        .web      { background: #6a11cb; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>🌐 Abrir Apps</h1>

        <!-- WhatsApp: sin número solo se puede abrir WhatsApp Web -->
        <a class="boton whatsapp" href="https://web.whatsapp.com/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M20.52 3.48A11.88 11.88 0 0 0 12.04 0C5.46 0 .1 5.36.1 11.94c0 2.1.55 4.15 1.6 5.96L0 24l6.25-1.64a11.9 11.9 0 0 0 5.79 1.48h.01c6.58 0 11.94-5.36 11.94-11.94 0-3.19-1.24-6.19-3.47-8.42z"/></svg>
            WhatsApp
        </a>

        <a class="boton tiktok" href="https://www.tiktok.com/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M12.9 0h3.03c.22 1.79 1.28 3.28 2.9 3.9.5.19 1.03.3 1.57.32v3.03a7.9 7.9 0 0 1-4.5-1.4v6.9a6.85 6.85 0 1 1-6.85-6.85c.16 0 .32.01.48.02v3.16a3.7 3.7 0 1 0 2.6 3.54V0z"/></svg>
            TikTok
        </a>

        <a class="boton facebook" href="https://www.facebook.com/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.5 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
            Facebook
        </a>

        <a class="boton gmail" href="https://mail.google.com/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>
            Gmail
        </a>

        <a class="boton web" href="https://tuweb.com" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0z"/></svg>
            Mi Web
        </a>
    </div>

</body>
</html>
